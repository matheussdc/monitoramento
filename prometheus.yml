global:
  scrape_interval: 10s
  external_labels:
    monitor: "codelab-monitor"

scrape_configs:
  - job_name: "prometheus-job"
    scrape_interval: 5s
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "application-job"
    scrape_interval: 5s
    static_configs:
      - targets: ["app:4567"]
